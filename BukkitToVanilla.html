<main class="wrap" id="main">
  <div class="kicker reveal" data-i18n="btv.kicker">BukkitToVanilla · world converter</div>
  <h1 class="reveal reveal-2" data-i18n-html="btv.h1">You lost your dimensions,<br>but you'll <span class="accent">get them back.</span></h1>
  <p class="lede reveal reveal-3" data-i18n-html="btv.lede"></p>

  <section class="panel reveal reveal-3" id="panel1">
    <div class="panel-head"><div class="title"><span class="num">01</span><h2 data-i18n="btv.p1">Server files</h2></div></div>
    <p class="hint" data-i18n-html="btv.p1.hint"></p>
    <label class="dropzone" id="dropzone">
      <svg class="icon" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M4 10a2 2 0 012-2h8l3 3h13a2 2 0 012 2v15a2 2 0 01-2 2H6a2 2 0 01-2-2V10z" stroke="currentColor" stroke-width="1.6"/><path d="M18 15v8m0-8l-3 3m3-3l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="main-txt" data-i18n="drop.main.server">Click to choose your server or world folder</div>
      <div class="sub-txt" data-i18n="drop.sub">or drag it here</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple>
    </label>
    <div class="status-line" id="scanStatus" role="status" aria-live="polite"></div>
  </section>

  <section class="panel disabled" id="panel2">
    <div class="panel-head"><div class="title"><span class="num">02</span><h2 data-i18n="btv.p2">Converted worlds</h2></div></div>
    <div class="toolbar" style="padding-top:14px"><div class="count-txt" id="count"></div></div>
    <div class="worlds" id="worlds"></div>
    <div class="status-line" id="dlStatus" role="status" aria-live="polite"></div>
    <div class="row-end"><button class="btn ghost" id="dlAll" type="button" disabled data-i18n="dl.all">All as ZIP</button></div>
    <div class="after-note">
      <p data-i18n-html="btv.after"></p>
      <ol>
        <li data-i18n-html="btv.after.1"></li>
        <li data-i18n-html="btv.after.2"></li>
        <li data-i18n-html="btv.after.3"></li>
      </ol>
    </div>
  </section>
</main>
